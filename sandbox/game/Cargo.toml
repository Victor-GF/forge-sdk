[package]
name = "forge_sandbox_game"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Biblioteca dinamica carregada pelo sandbox em runtime (hot reload). Nao e
# dependencia do sandbox: compile a parte com `cargo build -p forge_sandbox_game`.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
forge_os.workspace = true
