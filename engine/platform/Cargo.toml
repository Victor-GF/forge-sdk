[package]
name = "forja_platform"
version.workspace = true
edition.workspace = true

[dependencies]
forja_os.workspace = true

# Backend de janela do Windows. Relógio, sleep e arquivos vêm do forja_os.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
