[package]
name = "forja"
version = "0.1.0"
edition = "2024"
description = "Data-oriented game engine core: frame pipeline, job system, SoA world, physics and a software shading pipeline."

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
