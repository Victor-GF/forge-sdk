[workspace]
resolver = "3"
members = [
    "engine/*"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Nenhuma dependencia externa. Tudo o que falar com o SO e escrito a mao.
[workspace.dependencies]
forge_core = { path = "engine/core" }
forge_os = { path = "engine/os" }

# Sem unwinding: panic vira abort, como um assert em C.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true
