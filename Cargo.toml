[workspace]
resolver = "3"
# Pastas com nomes curtos; os crates mantêm o prefixo `forja_` (evita colisão com o `core` do
# Rust e com crates externos como `os`/`mem`).
members = [
    "engine/core",
    "engine/diag",
    "engine/mem",
    "engine/os",
    "engine/platform",
    "engine/inspect",
    "games/racing",
    "tests/crash",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
forja_core = { path = "engine/core" }
forja_diag = { path = "engine/diag" }
forja_mem = { path = "engine/mem" }
forja_os = { path = "engine/os" }
forja_platform = { path = "engine/platform" }
forja_inspect = { path = "engine/inspect" }

# Rust estilo C: nenhum caminho com panic implícito.
# Testes podem usar unwrap/indexação (ver clippy.toml).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
arithmetic_side_effects = "deny"

# Dev: código do workspace levemente otimizado, dependências otimizadas.
# panic = "abort": não há unwind; o gancho do forja_diag grava o crash report e aborta.
[profile.dev]
opt-level = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
